services:
  - type: web
    name: yatratap-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_NAME
        value: YatraTap
      - key: APP_ENV
        value: production
      - key: DEMO_MODE
        value: "true"
      - key: API_PREFIX
        value: /api
      - key: FRONTEND_URL
        sync: false

